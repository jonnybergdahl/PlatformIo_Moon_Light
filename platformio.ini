; PlatformIO Project Configuration File
;
; Moon Phase Light - SK6812 WWA LED strip
; Displays moon phase using Cool White / Warm White / Amber LEDs
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini, esp32_d1_mini, esp32s3_super_mini

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -Wall
    -Wextra
    -DFIRMWARE_VERSION=\"1.1.0\"
    -DLED_COUNT=5
lib_deps =
    tzapu/WiFiManager @ 2.0.17
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.3
    adafruit/Adafruit NeoPixel @ ^1.15.5

; Shared settings for all ESP32 variants
[esp32_common]
platform = platformio/espressif32 @ ^8.0.0
monitor_filters = esp32_exception_decoder
; Arduino core 3.x no longer fits the default 1.25 MB app slot. No OTA is
; used, so use the single 3 MB app layout (keeps a LittleFS data partition).
board_build.partitions = huge_app.csv

[env:d1_mini]
platform = platformio/espressif8266 @ ^4.2.1
board = d1_mini
monitor_filters = esp8266_exception_decoder
build_flags =
    ${env.build_flags}
    -DLED_PIN=D1

[env:esp32_d1_mini]
extends = esp32_common
board = wemos_d1_mini32
build_flags =
    ${env.build_flags}
    -DLED_PIN=5

[env:esp32s3_super_mini]
extends = esp32_common
board = lolin_s3_mini
build_flags =
    ${env.build_flags}
    -DLED_PIN=1
    ; Route Serial to the native USB port (the board has no USB-UART chip)
    -DARDUINO_USB_CDC_ON_BOOT=1
